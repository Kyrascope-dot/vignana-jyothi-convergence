version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: convergence-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: convergence-server
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=postgres
      - DB_PORT=5432
    ports:
      - "15032:5000"
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: convergence-client
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:15032
    ports:
      - "14032:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata: